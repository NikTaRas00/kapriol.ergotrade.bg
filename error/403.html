<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="/" />
  <title>403 — Access denied | Kapriol Bulgaria</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F7F4EF" />
  <link rel="icon" href="assets/img/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=2" />
  <style>
    /* Self-contained ON PURPOSE: inline CSS, no @font-face, no external request
       of any kind, so this page still renders during the outage it is
       reporting. The families below are the site's, declared with the same
       fallback chains style.css uses; if the woff2 is already in the browser
       cache from a normal visit it is used, and if not the page degrades to
       Arial Narrow / system sans rather than failing to paint. */
    :root{
      --bg:#F7F4EF;--surface:#fff;--surface-2:#f0ece4;
      --ink:#14110f;--ink-deep:#0a0806;--body:#463f38;--muted:#6d655c;--muted-soft:#8a8177;
      --line:#e8e3dc;
      --orange:#E35D15;--orange-cta:#C9500F;--orange-cta-hover:#a93d07;--orange-ink:#B4460A;
      --yellow:#F4B400;
      --hazard:repeating-linear-gradient(135deg,var(--ink) 0 8px,var(--yellow) 8px 16px);
      --r:2px;
      --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
      --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --ease-out:cubic-bezier(.23,1,.32,1);
      --ease-out-expo:cubic-bezier(.16,1,.3,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);
      font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
      min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    }
    .wrap{width:100%;max-width:1320px;margin-inline:auto;padding-inline:clamp(20px,4vw,40px)}
    :focus-visible{outline:3px solid var(--orange);outline-offset:2px}

    .head{background:var(--surface);border-bottom:3px solid var(--ink)}
    .head__inner{display:flex;align-items:baseline;gap:10px;padding-block:14px;min-height:62px}
    .brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
    .brand__mark{font-family:var(--font-display);font-weight:900;font-size:32px;letter-spacing:.5px;color:var(--ink);line-height:1}
    .brand__mark i{color:var(--orange);font-style:normal}
    .brand__tag{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

    main{flex:1;display:flex;align-items:center;padding-block:clamp(48px,10vh,96px)}
    .panel{max-width:600px}
    .code{
      font-family:var(--font-display);font-weight:900;
      font-size:clamp(4rem,14vw,6rem);line-height:.88;letter-spacing:.5px;color:var(--ink);
    }
    /* The one brand device, used here as the rule under the code.
       It does NOT wipe in, and that is the considered choice. The home page's
       hazard stripe animates from scaleX(0), but it is rescued by a JS
       failsafe when the animation fails to advance; this page ships no JS by
       design, so nothing could rescue it. Measured on the preview: an
       animation starting from a zero state parks there whether or not
       fill-mode is set. An error page is the last surface that can afford a
       missing element, so it gets no entrance motion at all. Button feedback
       below is safe because it transitions FROM a visible resting state. */
    .hazard{width:181px;height:10px;background:var(--hazard);margin:22px 0 20px}

    .eyebrow{
      font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
      color:var(--orange-ink);margin:0 0 10px;
    }
    h1{
      font-family:var(--font-display);text-transform:uppercase;font-weight:800;
      font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.02;letter-spacing:.2px;
      margin:0 0 14px;text-wrap:balance;
    }
    .lead{margin:0;color:var(--body);font-size:1rem;line-height:1.7;max-width:52ch;text-wrap:pretty}

    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      font:700 14px/1 var(--font-sans);padding:13px 24px;border-radius:var(--r);
      border:2px solid transparent;text-decoration:none;white-space:nowrap;cursor:pointer;
      transition:transform 160ms var(--ease-out),background-color 200ms ease,color 200ms ease,border-color 200ms ease;
    }
    .btn:active{transform:scale(.97)}
    .btn--primary{background:var(--orange-cta);border-color:var(--orange-cta);color:#fff}
    .btn--ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
    .btn svg{width:15px;height:15px;display:block}
    @media(hover:hover) and (pointer:fine){
      .btn--primary:hover{background:var(--orange-cta-hover);border-color:var(--orange-cta-hover)}
      .btn--ghost:hover{background:var(--ink);color:#fff}
    }

    .foot{background:var(--ink-deep);padding-block:18px}
    .foot span{color:var(--muted-soft);font-size:12px}

    @media(max-width:430px){
      .brand__tag{display:none}
      .brand__mark{font-size:27px}
      .actions .btn{width:100%}
    }
    @media(pointer:coarse){.btn{min-height:44px}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
      .btn:active{transform:none}
    }
  </style>
</head>
<body>
  <header class="head">
    <div class="wrap head__inner">
      <a class="brand" href="./" aria-label="Kapriol Bulgaria — home">
        <span class="brand__mark">KAPRIOL<i>.</i></span>
        <span class="brand__tag">Bulgaria</span>
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="panel">
        <div class="code">403</div>
        <div class="hazard" aria-hidden="true"></div>
        <p class="eyebrow">Error 403</p>
        <h1>Access denied</h1>
        <p class="lead">You don’t have permission to view this page.</p>
        <div class="actions">
          <a class="btn btn--primary" href="./">
            Back to home
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn btn--ghost" href="products">Browse the catalogue</a>
          <a class="btn btn--ghost" href="contact">Contact us</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap"><span>© 2026 Ergotrade Ltd. Kapriol is exclusively distributed in Bulgaria by ergotrade.bg</span></div>
  </footer>
</body>
</html>
