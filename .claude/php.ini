; Local-dev php.ini for testing the kapriol.bg admin area with PHP's built-in
; server. Enables the extensions the admin code needs (mbstring for mb_strlen).
; Not deployed — the cPanel host has its own php.ini.

extension_dir = "C:\Users\NikTaRas\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"
extension=mbstring
; gd + exif so image uploads exercise the same re-encode/WebP path as the host.
extension=gd
extension=exif
extension=fileinfo
; pdo_mysql so the catalogue DB tooling (deploy/db-import.php,
; deploy/db-verify.php) can run against MySQL from this machine.
; The DLL ships with PHP; it is simply off by default.
extension=pdo_mysql
; pdo_sqlite is LOCAL-TEST ONLY: the host DB is MySQL and port 3306 is
; firewalled from here, so the API/admin SQL is exercised offline against
; an equivalent SQLite copy of the same data. Not used by any shipped code.
extension=pdo_sqlite

; Show errors while developing.
display_errors = On
error_reporting = E_ALL
