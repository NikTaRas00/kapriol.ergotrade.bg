<!DOCTYPE html>
<!--
  Error-page template. Copy to error/<code>.html for each code
  (400/401/403/404/405/429/500/502/503/504) and edit CODE + TITLE + MESSAGE.

  RULES (do not break):
  - Self-contained: inline CSS only, ZERO external requests, no @font-face, no JS.
    It must render during the very outage it reports.
  - <base href="/"> so nav links resolve regardless of the failing URL's depth
    (prefix it if the site lives in a subfolder).
  - NO entrance animation. Only button hover/press (from a visible resting state).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <base href="/" />
  <title>404 — Page not found</title>
  <style>
    :root { --ink:#14110f; --muted:#6a6f76; --line:#d9dbde; --bg:#f7f4ef; --accent:#c9500f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column;
           font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:18px 24px; border-bottom:3px solid var(--ink); font-weight:800; letter-spacing:.02em; }
    main { flex:1; display:grid; place-content:center; text-align:center; padding:40px 24px; }
    .code { font-size:clamp(64px,18vw,140px); font-weight:800; line-height:1; }
    h1 { margin:.2em 0 .1em; font-size:clamp(20px,4vw,28px); }
    p { color:var(--muted); max-width:46ch; margin:0 auto 1.6em; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; padding:11px 20px; border-radius:6px; text-decoration:none; border:1px solid var(--accent); }
    a.btn--primary { background:var(--accent); color:#fff; }
    a.btn--ghost { color:var(--ink); border-color:var(--line); }
    a.btn:hover { filter:brightness(.95); }
    a.btn:active { transform:translateY(1px); }
    footer { padding:16px 24px; color:var(--muted); font-size:.85rem; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <header>BRAND<span style="color:var(--accent)">.</span></header>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you were looking for isn't here. It may have moved, or the link was mistyped.</p>
    <div class="actions">
      <a class="btn btn--primary" href="./">Home</a>
      <a class="btn btn--ghost" href="products">Browse</a>
      <a class="btn btn--ghost" href="contact">Contact</a>
    </div>
  </main>
  <footer>&copy; BRAND</footer>
</body>
</html>
